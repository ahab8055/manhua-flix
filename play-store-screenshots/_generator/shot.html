<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&display=block" rel="stylesheet">
<script src="data.js"></script>
<style>
:root{--bg:#050507;--surf:#0C0D11;--card:#14151A;--muted:#8B909B;--border:#1C1E24;--red:#FF3142;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050507;overflow:hidden}
body{font-family:Urbanist,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#canvas{position:relative;overflow:hidden;background:#050507}
/* ---------- backdrop ---------- */
.bd-art{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);opacity:.42}
.bd-glow{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 18%,rgba(255,49,66,.38),transparent 70%),radial-gradient(70% 50% at 50% 100%,rgba(80,48,229,.28),transparent 70%),linear-gradient(180deg,rgba(5,5,7,.55),rgba(5,5,7,.2) 40%,rgba(5,5,7,.85))}
.bd-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:14px 14px;-webkit-mask-image:linear-gradient(160deg,#000 0%,transparent 55%);opacity:.9}
.bd-lines{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,255,255,.035) 0deg 1.2deg,transparent 1.2deg 7deg);-webkit-mask-image:radial-gradient(circle at 50% 30%,transparent 18%,#000 60%)}
/* ---------- caption ---------- */
.cap{position:absolute;text-align:center;z-index:5}
.cap h1{font-weight:900;text-transform:uppercase;line-height:.98;letter-spacing:-.5px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.cap h1 em{font-style:normal;color:var(--red)}
.cap p{font-weight:600;color:#D5D8DF;margin-top:12px;line-height:1.3}
.wm{font-weight:900;letter-spacing:1px}.wm b{color:var(--red);font-weight:900}
/* ---------- devices ---------- */
.dev{position:absolute;z-index:4;background:linear-gradient(145deg,#2a2b31,#0b0b0e 40%,#1b1c21);box-shadow:0 0 0 2px #34363d,0 40px 90px rgba(0,0,0,.75),0 0 80px rgba(255,49,66,.18)}
.dev .scr{position:absolute;overflow:hidden;background:var(--bg)}
.dev .scr>.screen{transform-origin:0 0;position:absolute;left:0;top:0}
.cam{position:absolute;border-radius:50%;background:#000;box-shadow:inset 0 0 0 2px #1a1a1f;z-index:3}
/* ---------- app screen ---------- */
.screen{background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column}
.sb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:700;color:#fff}
.sb .ic{display:flex;gap:6px;align-items:center}
.body{flex:1;overflow:hidden;position:relative}
.pad{padding:0 16px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.hdr .wm{font-size:30px;line-height:34px}
.iconbtn{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn.f{background:rgba(255,255,255,.08);width:38px;height:38px}
.badge-n{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--red);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:12px 0 10px}
.sh .t{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.sh .t:before{content:"";width:3px;height:24px;border-radius:2px;background:var(--red)}
.sh .a{color:var(--red);font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px}
.feat{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surf);flex:none}
.feat .cv{height:155px;background-size:cover;background-position:center}
.feat .mt{height:104px;padding:10px 14px 12px;display:flex;flex-direction:column;justify-content:space-between}
.feat .mt .tt{font-size:16px;font-weight:800;line-height:20px}
.feat .ft{display:flex;justify-content:space-between;align-items:center}
.feat .sub{color:var(--red);font-size:13px;font-weight:600}
.chip-o{border:1px solid var(--red);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.dots i{width:7px;height:7px;border-radius:4px;background:#5E616A}.dots i.on{background:var(--red)}
.rail{display:flex;gap:10px;overflow:hidden}
.pc{border-radius:10px;border:1px solid var(--border);overflow:hidden;background:var(--surf);flex:none}
.pc .cv{background-size:cover;background-position:center;position:relative}
.pc .mt{padding:6px 8px;height:58px}
.pc .mt .tt{font-size:12px;font-weight:700;line-height:16px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .mt .c{color:var(--muted);font-size:10px;font-weight:700;line-height:12px;margin-top:2px}
.nb{position:absolute;top:6px;left:6px;background:var(--red);border-radius:5px;padding:2px 6px;font-size:9px;font-weight:700}
.prog{position:absolute;left:8px;right:8px;bottom:6px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#D5D8DF}
.prog .tr{flex:1;height:4px;border-radius:4px;background:#535866;overflow:hidden}.prog .tr i{display:block;height:100%;background:var(--red)}
.tabs{flex:none;border-top:1px solid #16171B;background:var(--bg);padding:10px 12px 0;display:flex}
.tabs .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;font-size:12px;color:#C4C7CE;font-weight:500}
.tabs .tb.on{color:var(--red);font-weight:700}
.gest{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.gest i{width:120px;height:4px;border-radius:2px;background:#e8e8ea;opacity:.8}
/* detail */
.banner{height:200px;background-size:cover;background-position:center;position:relative}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,7,.1),rgba(5,5,7,.0) 40%,var(--bg))}
.topbar{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;background:rgba(5,5,7,.88)}
.topbar .wm{font-size:20px;font-weight:600;letter-spacing:0}
.hero{display:flex;gap:14px;padding:0 16px;margin-top:-70px;position:relative;z-index:2}
.poster{width:130px;height:185px;border-radius:12px;background-size:cover;background-position:center;flex:none;border:1px solid #2a2c33;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.hm{flex:1;padding-top:74px;min-width:0}
.hm .tt{font-size:20px;font-weight:800;line-height:24px}
.gr{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gt{border:1px solid rgba(255,49,66,.5);background:rgba(255,49,66,.1);color:#FF8A94;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.ms{color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:4px}
.ms b{color:#fff}
.desc{color:#B9BDC6;font-size:13px;line-height:18px;font-weight:500}
.eng{display:flex;margin:16px 16px 0;border:1px solid var(--border);background:var(--surf);border-radius:12px;padding:12px 0}
.eng .e{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700}
.eng .d{width:1px;background:var(--border)}
.dtabs{display:flex;margin:16px 16px 0;border-bottom:1px solid var(--border)}
.dtabs .x{flex:1;text-align:center;padding:12px 0;font-size:15px;font-weight:700;color:var(--muted)}
.dtabs .x.on{color:#fff;border-bottom:3px solid var(--red)}
.erow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #121318}
.eth{width:128px;height:72px;border-radius:10px;background-size:cover;background-position:center;position:relative;flex:none}
.pcirc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:15px;background:rgba(255,49,66,.92);display:flex;align-items:center;justify-content:center}
.newdot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:5px;background:var(--red);border:2px solid #fff}
.en{color:var(--red);font-size:12px;font-weight:800}
.et{font-size:15px;font-weight:700;margin:2px 0}
.em{color:var(--muted);font-size:12px;font-weight:600}
.card{background:var(--surf);border:1px solid var(--border);border-radius:14px}
.btn-r{background:var(--red);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:800;text-align:center}
.btn-g{background:rgba(255,255,255,.08);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;text-align:center}
/* profile */
.av{border-radius:50%;background-size:cover;background-position:center;flex:none}
.lvl{background:rgba(255,49,66,.15);border:1px solid var(--red);color:#FF8A94;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.xp{height:8px;border-radius:4px;background:#23252c;overflow:hidden;margin:8px 0 6px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#FF3142,#FF7A45)}
.rank{border:1.5px solid;border-radius:14px;padding:10px 14px;text-align:center;flex:none;width:104px}
.rank .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.rank .v{font-size:40px;font-weight:900;line-height:44px}
.rank .tr{font-size:11px;font-weight:700;color:#D5D8DF}
.st{margin-bottom:12px}
.st .r{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
.st .r span{color:var(--muted);font-weight:700}
.st .bar{height:7px;border-radius:4px;background:#1E2027;overflow:hidden}.st .bar i{display:block;height:100%;border-radius:4px}
.ar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--border);font-size:14px;font-weight:700}
.ar span{color:var(--muted);font-weight:600}
/* search */
.sbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #2A2C33;border-radius:14px;padding:13px 14px;color:var(--muted);font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:#D5D8DF}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.lbl{font-size:16px;font-weight:800;margin:18px 0 10px;display:flex;justify-content:space-between}
.lbl span{color:var(--red);font-size:13px}
.grid{display:grid;gap:10px}
/* channels */
.chrow{display:flex;gap:12px;align-items:center}
.vf{display:inline-flex;width:16px;height:16px;border-radius:8px;background:#3B82F6;align-items:center;justify-content:center;vertical-align:-2px;margin-left:4px}
.mini{display:flex;gap:8px;margin-top:12px}
.mini i{flex:1;aspect-ratio:2/3;border-radius:8px;background-size:cover;background-position:center;display:block;max-width:90px}
/* comments */
.cm{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #121318}
.cm .n{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm .tx{font-size:14px;line-height:19px;color:#D5D8DF;margin:4px 0 6px;font-weight:500}
.cm .ac{display:flex;gap:16px;color:var(--muted);font-size:12px;font-weight:700;align-items:center}
.rk{border:1px solid;border-radius:6px;padding:0 6px;font-size:11px;font-weight:900;line-height:17px}
.lv{color:var(--muted);font-size:11px;font-weight:700}
/* player */
.player{position:relative;background-size:cover;background-position:center;flex:none}
.player:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 60%,rgba(0,0,0,.75))}
.pctl{position:absolute;left:12px;right:12px;bottom:10px;z-index:2}
.pctl .bar{height:4px;background:rgba(255,255,255,.3);border-radius:2px;position:relative}
.pctl .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:2px}
.pctl .bar b{position:absolute;top:50%;width:13px;height:13px;border-radius:7px;background:var(--red);transform:translate(-50%,-50%)}
.pctl .tm{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:8px}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:31px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;z-index:2}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.pill.on{border-color:var(--red);color:#FF8A94;background:rgba(255,49,66,.1)}
/* floating callouts */
.float{position:absolute;z-index:6;border-radius:18px;background:#101116;border:1px solid #2A2C33;box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03)}
.fan{position:absolute;border-radius:14px;background-size:cover;background-position:center;box-shadow:0 20px 50px rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.12);z-index:2}
</style></head>
<body><div id="canvas"></div>
<script>
const P=new URLSearchParams(location.search);const DEV=P.get('d')||'phone';const N=+(P.get('n')||1);
const img=(id,k='title')=>`img/${id}_${k}.jpg`;const bg=u=>`background-image:url('${u}')`;
const m=id=>M[id];
// ---------- icons ----------
const I={
home:(c,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`,
heart:(c,s=22,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.3 1 5 2.8 1.7-1.8 3-2.8 5-2.8 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>`,
users:(c,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M15.5 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>`,
search:(c,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
user:(c,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg>`,
bell:(c='#fff',s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`,
back:(c='#fff',s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,
share:(c='#fff',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>`,
play:(c='#fff',s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M6 3.5 20 12 6 20.5z"/></svg>`,
chev:(c='#FF3142',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>`,
eye:(c='#8B909B',s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M2 12c2-5 6-8 10-8s8 3 10 8c-2 5-6 8-10 8S4 17 2 12z"/><circle cx="12" cy="12" r="3.5"/></svg>`,
like:(c='#fff',s=20,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M7 10v11H3V10zM7 10l4-7c1.7 0 2.8 1.2 2.5 3L13 9h6.2a2 2 0 0 1 2 2.4l-1.6 7.8A2.2 2.2 0 0 1 17.4 21H7"/></svg>`,
cmt:(c='#fff',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
check:(c='#fff',s=10)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>`,
gift:(c='#FFD166',s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8C10 4 6.5 4.5 7 7c.3 1.5 5 1 5 1s4.7.5 5-1c.5-2.5-3-3-5 1"/></svg>`,
pin:(c='#FF3142',s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M15 3l6 6-3 1-4 4 1 5-2 1-4-5-5 5-1-1 5-5-5-4 1-2 5 1 4-4z"/></svg>`,
x:(c='#8B909B',s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
clock:(c='#8B909B',s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
};
const statusBar=()=>`<div class="sb"><span>12:30</span><span class="ic">
<svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 11.5 0 3a11.5 11.5 0 0 1 16 0z"/></svg>
<svg width="14" height="12" viewBox="0 0 14 12" fill="#fff"><path d="M14 0v12H0z"/></svg>
<svg width="22" height="12" viewBox="0 0 22 12"><rect x=".5" y=".5" width="19" height="11" rx="3" fill="none" stroke="#fff" opacity=".6"/><rect x="2" y="2" width="13" height="8" rx="1.5" fill="#fff"/><rect x="20" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg></span></div>`;
const tabBar=a=>{const T=[['Channels','users'],['Favorites','heart'],['Home','home'],['Search','search'],['Profile','user']];
return `<div class="tabs">${T.map(([n,i])=>`<div class="tb ${a===n?'on':''}">${I[i](a===n?'#FF3142':'#C4C7CE',n==='Home'?24:22)}${n}</div>`).join('')}</div><div class="gest"><i></i></div>`};
const header=(bell=3)=>`<div class="hdr"><div style="width:40px"></div><div class="wm" style="flex:1;margin-left:0"><b>MANHUA</b>FLIX</div><div class="iconbtn">${I.bell('#fff',24)}${bell?`<span class="badge-n">${bell}</span>`:''}</div></div>`;
const poster=(id,{w=122,ch,badge,prog}={})=>{const h=Math.round(w*148/122);return `<div class="pc" style="width:${w}px"><div class="cv" style="height:${h}px;${bg(img(id))}">${badge?`<span class="nb">${badge}</span>`:''}</div><div class="mt"><div class="tt">${m(id).t}</div><div class="c">${ch||('Ch. '+m(id).ch)}</div></div></div>`};
const wide=(id,p,ch)=>`<div class="pc" style="width:170px"><div class="cv" style="height:96px;${bg(img(id,'cover'))}"><div class="prog"><div class="tr"><i style="width:${p}%"></i></div>${p}%</div></div><div class="mt"><div class="tt">${m(id).t}</div><div class="c">${ch}</div></div></div>`;
const secH=t=>`<div class="sh"><div class="t">${t}</div><div class="a">See All ${I.chev()}</div></div>`;
const featCard=(id,w,ch)=>`<div class="feat" style="width:${w}px"><div class="cv" style="${bg(img(id,'cover'))}"></div><div class="mt"><div class="tt">${m(id).t}</div><div class="ft"><span class="sub">${m(id).g.slice(0,3).join(' • ')}</span><span class="chip-o">${ch}</span></div></div></div>`;
